# 因子监控配置。凭据全部走 GitHub Secrets，这里不出现任何真实密钥。

data:
  parquet_path: data/factor_timeseries.parquet
  # ccxt/Binance 现货 K 线的可回填起点，具体币种若上市更晚，collector 会自动从其实际上市日开始
  backfill_start_date: "2017-08-17"
  # FRED 宏观序列的回填起点：早于所有序列实际起始日即可，collector 内部按各序列
  # 自己的历史起点前向填充，这个日期只用来限定切片的左边界
  macro_backfill_start_date: "1955-01-01"

assets:
  - BTC
  - ETH
  - SOL
  - UNI
  - LINK
  - LTC
  - MACRO
  - MARKET

exchange:
  # Binance 对 GitHub Actions 默认 runner 的美国 IP 段有地域限制（451），
  # 改用 OKX：现货 + 永续资金费率同一个交易所类即可，不受此限制
  ccxt_id: okx
  # 现货 K 线来源，用于技术类因子（MA/RSI/MACD/布林带/量比）
  symbols:
    BTC: BTC/USDT
    ETH: ETH/USDT
    SOL: SOL/USDT
    UNI: UNI/USDT
    LINK: LINK/USDT
    LTC: LTC/USDT
  # 永续合约资金费率来源
  funding_ccxt_id: okx
  funding_symbols:
    BTC: BTC/USDT:USDT
    ETH: ETH/USDT:USDT
    SOL: SOL/USDT:USDT
    UNI: UNI/USDT:USDT
    LINK: LINK/USDT:USDT
    LTC: LTC/USDT:USDT
  # OKX 公开统计接口用的原生代码，跟 ccxt 统一符号不是一回事，单独配一份
  oi_ccy:
    BTC: BTC
    ETH: ETH
    SOL: SOL
    UNI: UNI
    LINK: LINK
    LTC: LTC
  long_short_inst_id:
    BTC: BTC-USDT-SWAP
    ETH: ETH-USDT-SWAP
    SOL: SOL-USDT-SWAP
    UNI: UNI-USDT-SWAP
    LINK: LINK-USDT-SWAP
    LTC: LTC-USDT-SWAP

coinbase_premium:
  # 原规格是 vs Binance，Binance 对 GitHub Actions 有地域限制，改用 OKX 做参照价
  BTC:
    coinbase_product: BTC-USD
    ref_symbol: BTC/USDT

cryptoquant:
  # CryptoQuant 完全不覆盖 SOL/UNI/LINK/LTC；当前套餐 API 历史深度约365天
  netflow_assets:
    BTC: btc
    ETH: eth
  pnl_supply_assets:
    BTC: btc

defillama:
  chain_tvl:
    ETH: Ethereum
    SOL: Solana
  dex_protocols:
    UNI: uniswap
  fee_protocols:
    UNI: uniswap

deribit:
  # DVOL 只有 BTC/ETH，2021-03 上线
  currencies:
    BTC: BTC
    ETH: ETH

fred:
  # units: pc1=同比%变化（CPI/PCE/M2 这类会一直趋势上升的指数用同比，
  # 否则 z-score 会被长期趋势带偏）；lin=原始值（利率类本身已经是比率，直接用）
  series:
    core_cpi:
      id: CPILFESL
      units: pc1
    core_pce:
      id: PCEPILFE
      units: pc1
    m2:
      id: M2SL
      units: pc1
    fed_funds_rate:
      id: FEDFUNDS
      units: lin
    treasury_10y:
      id: DGS10
      units: lin

anomaly:
  window_days: 90
  min_window_days: 30
  z_threshold: 2.0
  # 硬阈值开关：即使 z 未超阈值，触碰这些边界也报警
  hard_thresholds:
    funding_rate:
      high: 0.001   # 0.1%/8h
      low: -0.001
    fear_greed:
      low: 20
      high: 80

# 因子展示名 + 多空含义文案占位符，规格2 用规则表补全 direction_text
