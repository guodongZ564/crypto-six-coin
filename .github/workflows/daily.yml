name: Daily Factor Collection

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily collection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CRYPTOQUANT_API_KEY: ${{ secrets.CRYPTOQUANT_API_KEY }}
        run: python run_daily.py

      # 旧的六币固定分档播报(run_scoring.py)已下线：UNI/LINK/LTC 回测验证是
      # 反向信号，固定 ±0.4/±1.0 分档也被动态分位取代，不能再每天推已知
      # 有问题的判断。脚本本身留在仓库供手动调试，只是不再接入这个定时任务。
      - name: Run narrated report (BTC/ETH/SOL)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m narrate.run_narrated_report

      # 事后不可改的实盘留痕：只追加当天的分数、只回填到期的未来收益，
      # 历史行永远不会被重算。跟评分同一批数据(prepare_report)，所以放在
      # 叙事之后、仪表盘之前都行，这里选紧跟叙事之后。
      - name: Record scoring track (BTC/ETH/SOL)
        run: python -m tracking.record_track

      - name: Generate tracking validation report (docs/tracking.html)
        run: python -m tracking.report

      # 手动触发(workflow_dispatch)走的是同一个 job、同一套 on: 触发器，会
      # 完整跑一遍采集→评分→生成，不是单独刷新页面。
      - name: Build dashboard (docs/index.html)
        run: python -m dashboard.build_dashboard

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/factor_timeseries.parquet data/composite_score_history.parquet data/scoring_track.parquet
          git diff --cached --quiet || git commit -m "data: daily factor + score update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      # docs/ 每天全量重新生成、体积不小，不进 main 的提交历史——单独发到
      # 一个孤儿分支 gh-pages，每次都是全新的单个commit、force push覆盖，
      # 不在任何分支上累积历史。整个 docs/ 目录都拷过去(index.html +
      # tracking.html)，不是只拷一个文件。
      - name: Deploy dashboard to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/pages-deploy
          cp -r docs /tmp/pages-deploy
          git checkout --orphan gh-pages-deploy
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx -q
          cp -r /tmp/pages-deploy/. .
          git add .
          git commit -m "dashboard: update $(date -u +%Y-%m-%d)"
          git push origin gh-pages-deploy:gh-pages --force
          git checkout main
          git branch -D gh-pages-deploy
